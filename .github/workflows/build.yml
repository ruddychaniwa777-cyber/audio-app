name: Pocket Rivals Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pocket Rivals
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify React Native Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f App.tsx
          echo "Pocket Rivals native Android project found."

      - name: Configure LevelPlay public identifiers
        env:
          LEVELPLAY_APP_KEY: ${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_REWARDED_AD_UNIT_ID: ${{ secrets.LEVELPLAY_REWARDED_AD_UNIT_ID }}
          LEVELPLAY_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.LEVELPLAY_INTERSTITIAL_AD_UNIT_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("App.tsx")
          text = path.read_text()

          values = {
              "PUT_YOUR_UNITY_LEVELPLAY_APP_KEY_HERE":
                  os.environ.get("LEVELPLAY_APP_KEY", ""),
              "PUT_YOUR_REWARDED_AD_UNIT_ID_HERE":
                  os.environ.get("LEVELPLAY_REWARDED_AD_UNIT_ID", ""),
              "PUT_YOUR_INTERSTITIAL_AD_UNIT_ID_HERE":
                  os.environ.get("LEVELPLAY_INTERSTITIAL_AD_UNIT_ID", ""),
          }

          for placeholder, value in values.items():
              if value:
                  text = text.replace(placeholder, value)

          path.write_text(text)
          PY

      - name: Check LevelPlay configuration
        run: |
          if grep -q "PUT_YOUR_UNITY_LEVELPLAY_APP_KEY_HERE" App.tsx; then
            echo "::warning::LEVELPLAY_APP_KEY secret is not configured."
          else
            echo "LevelPlay app key configured."
          fi

          if grep -q "PUT_YOUR_REWARDED_AD_UNIT_ID_HERE" App.tsx; then
            echo "::warning::Rewarded ad unit ID secret is not configured."
          else
            echo "Rewarded ad unit configured."
          fi

          if grep -q "PUT_YOUR_INTERSTITIAL_AD_UNIT_ID_HERE" App.tsx; then
            echo "::warning::Interstitial ad unit ID secret is not configured."
          else
            echo "Interstitial ad unit configured."
          fi

      - name: Build standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Pocket Rivals APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Rivals-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
